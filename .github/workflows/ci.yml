name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # The bundled LiteRT framework is arm64-only, so this needs an Apple silicon runner and a
    # concrete simulator destination rather than the generic one.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Build and run tests
        # Local model and grounding assets are gitignored; suites that need them skip themselves.
        run: |
          set -o pipefail
          xcodebuild \
            -project Aquinas-iOS.xcodeproj \
            -scheme Aquinas-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
